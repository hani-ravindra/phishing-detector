<!DOCTYPE html>
<html>
<head>
    <title>Phishing Detector</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            width: 280px; /* A bit wider for the new layout */
            padding: 15px;
        }
        h1 {
            font-size: 18px;
            color: #333;
            text-align: center;
            margin: 0 0 15px 0;
        }
        
        /* This new container will hold the logo and message */
        #status-container {
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }
        
        /* This is our new logo */
        #status-logo {
            width: 120px;
            height: 120px;
            margin-right: 12px;
            flex-shrink: 0; /* Prevents logo from shrinking */
        }
        
        /* This is our message, which will change */
        #status-message {
            font-size: 16px;
            font-weight: bold;
            margin: 0;
        }

        /* Status colors */
        .safe { color: #28a745; }
        .warning { color: #dc3545; }
        .neutral { color: #6c757d; }
    </style>
</head>
<body>
    <h1>Phishing Detector</h1>
    
    <div id="status-container">
        <img id="status-logo" src="icons/icon48.png" alt="Status">
        
        <p id="status-message" class="neutral">Analyzing...</p>
    </div>

    <script src="popup.js"></script>
</body>
</html>
